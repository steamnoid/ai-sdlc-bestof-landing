[project]
name = "fixture"
version = "0.1.0"
description = "A manifest, a register of consignments, and a delivery."
requires-python = ">=3.12"
license = { file = "LICENSE" }

# **Two, and the comment is the reason.**
#
# `httpx` is the one call this system makes outside itself. `typer` is the door a person comes
# in by. A third would be a cost with no caller, and a cost with no caller is a defect.
dependencies = [
    "httpx>=0.27",
    "typer>=0.15",
]

[project.scripts]
fixture = "fixture.cli:fixture"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default suite is free of every real dependency, and the real tiers are deselected here
# rather than skipped inside a test — a skip that prints its reason is a test that lied.
addopts = "-m 'not e2e and not ui and not integration' --strict-markers"
markers = [
    "e2e: a real model, a real public manifest, a real delivery",
    "ui: a real browser driving a real server",
    "integration: a real container",
]
